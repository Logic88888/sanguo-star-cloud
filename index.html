<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三国星云</title>
  <link rel="stylesheet" href="/src/style.css?v=2" />
</head>
<body>
  <div id="canvas-root"></div>

  <div id="ui">
    <header id="brand">
      <h1>三国星云</h1>
      <p class="sub" id="stat"></p>
    </header>

    <nav id="faction-filter" aria-label="势力筛选"></nav>

    <div id="search-wrap">
      <input id="search" type="text" placeholder="搜索姓名 / 字 / 称号…" autocomplete="off" spellcheck="false" />
      <ul id="search-list"></ul>
    </div>

    <aside id="panel" class="hidden" aria-live="polite">
      <button id="panel-close" title="关闭" aria-label="关闭">✕</button>
      <div id="panel-actions">
        <button id="panel-benshen" title="把这位人物设为你的本命武将">设为本命</button>
        <button id="panel-share" title="复制分享链接">⧉ 分享</button>
      </div>
      <div id="panel-body"></div>
    </aside>

    <div id="tooltip" class="hidden"></div>
    <div id="benshin" class="hidden" title="点击寻访本命武将"></div>

    <button id="quality-btn" title="切换画质（影响辉光、像素比与星尘密度）">画质·高</button>

    <footer id="hint">拖拽旋转 · 滚轮缩放 · WASD 平移 · 点击星星查看生平 · H 隐藏界面 · F 全屏</footer>

    <div id="guide" class="hidden">
      <div class="guide-card">
        <div class="guide-step" id="guide-step">1 / 3</div>
        <h2 id="guide-title">三国星云 · 一人一星</h2>
        <p id="guide-text">这里的每颗星，是一位真实的三国人物。</p>
        <div class="guide-dots" id="guide-dots"><i class="on"></i><i></i><i></i></div>
        <div class="guide-btns">
          <button id="guide-skip" class="ghost">跳 过</button>
          <button id="guide-next">下一步</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
